
name: Pytest

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
      - v2.0
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.cursor/**'
      - '.github/workflows/build-docs.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/pylint.yaml'
  pull_request:
    branches:
      - main
      - v2.0
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.cursor/**'
      - '.github/workflows/build-docs.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/pylint.yaml'

jobs:
  test:
    # Keep the container-runtime ABI stable instead of following ubuntu-latest upgrades.
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Update apt package list
        run: sudo apt-get update
      - name: Install podman
        run: sudo apt-get install -y podman
      - name: Install bubblewrap
        run: |
          sudo apt-get install -y bubblewrap
          sudo chmod u+s $(which bwrap)  # ensure we can set uid permissions
      - name: Install pinned singularity/apptainer
        run: |
          sudo apt-get install -y fakeroot uidmap libfuse3-3 squashfs-tools
          package="$RUNNER_TEMP/apptainer_1.3.4_amd64.deb"
          curl --fail --location --retry 3 \
            https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb \
            --output "$package"
          sudo apt-get install -y "$package"
          test "$(apptainer version)" = "1.3.4"
          sudo apptainer config fakeroot --add "$(id -un)"
          sudo ln -sf /usr/bin/apptainer /usr/bin/singularity
      - name: Verify writable fakeroot container execution
        run: |
          smoke_root=$(mktemp -d "$RUNNER_TEMP/apptainer-smoke.XXXXXX")
          trap 'sudo rm -rf "$smoke_root"' EXIT
          singularity version
          singularity build --sandbox "$smoke_root/sandbox" docker://python:3.11-slim
          singularity --quiet exec --contain --cleanenv --fakeroot --writable \
            "$smoke_root/sandbox" bash -c \
            'test "$(id -u)" = 0 && touch /usr/pocket-context-ci-smoke && test -f /usr/pocket-context-ci-smoke && echo "fakeroot execution verified"'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
            uv pip install --python ${Python_ROOT_DIR} -e '.[full,browsecomp-plus,daytona]'
      - name: Configure mini-swe-agent
        run: |
          mini-extra config set MSWEA_CONFIGURED 'true'
          mini-extra config set OPENAI_API_KEY '${{ secrets.OPENAI_API_KEY }}'
          mini-extra config set OPENROUTER_API_KEY '${{ secrets.OPENROUTER_API_KEY }}'
          # mini-extra config set PORTKEY_API_KEY '${{ secrets.PORTKEY_API_KEY }}'
          mini-extra config set REQUESTY_API_KEY '${{ secrets.REQUESTY_API_KEY }}'
      - name: Run pytest
        run: pytest -v --cov --cov-branch --cov-report=xml -n auto
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SWE-agent/mini-swe-agent
