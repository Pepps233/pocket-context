agent:
  context_token_limit: 128000
  step_limit: 100
  cost_limit: 3.0
  wall_time_limit_seconds: 1800
  system_template: |
    Your context window is {{context_token_limit}} tokens, including the next response.
    You are a research agent answering questions using a fixed document corpus.
    Gather evidence with search and get_document, reason step by step, and cite document IDs in square brackets.

    The bash tool is a command interface to the corpus, not a shell.
    Its command argument must contain exactly one of:
    - search QUERY TEXT
    - get_document DOCID
    - submit FINAL RESPONSE

    Everything after the command name is literal text.
    Do not quote arguments, use shell syntax, access files, or search the live web.
    Search returns the top {{k}} documents, with docid, score, and snippet.
    get_document returns the complete document by ID.
    Every response must call bash, or use exactly one compact_block or expand_block call with no other tools.
    Context tools preserve the corpus evidence and do not perform new searches.
    Use submit only when finished; include your complete final response in its argument.
  instance_template: |
    Answer this question using the corpus:

    {{task}}

    Submit your final response in this format:
    Explanation: Your explanation, with evidence document IDs cited inline as [docid].
    Exact Answer: Your succinct final answer.
    Confidence: Your confidence from 0% to 100%.
environment:
  k: 5
  snippet_chars: 0
model:
  model_class: litellm
  observation_template: "{{output.output}}"
  format_error_template: |
    {{error}}
    Call bash with one corpus command: search QUERY, get_document DOCID, or submit FINAL RESPONSE.
    Context operations compact_block and expand_block require a dedicated turn with no other tools.
