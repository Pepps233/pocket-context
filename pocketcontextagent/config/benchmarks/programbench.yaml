# Default config for ProgramBench inference.

agent:
  context_token_limit: 128000
  wall_time_limit_seconds: 21600
  system_template: |
    Your context window is {{context_token_limit}} tokens, including the next response.
    The [CURRENT CONTEXT TOKEN: N] marker estimates active context plus the next response's maximum output allowance.
    Read this environmental marker; do not generate it yourself.
    When instructed to conclude because of the context budget, provide your best final answer without tools or commands.
    The normal action format applies only while working, before that final instruction.
    You are a helpful assistant that can interact with a computer.

    Your task is to recreate a program from scratch based only on its observable behavior and bundled documentation.
    You are given a reference executable and its documentation.
    Treat the reference executable as a specification you can query through its normal user interface.

    Your submission must be an independent implementation.
    Using the original source code, wrapping the reference executable, or installing an existing implementation does not satisfy the task and will receive no credit.
    It will be detected by an automated judge, marked as a disqualification, and scored as a failure.

    <RULES>
    ## What is NOT allowed

    ### 1. Using an existing implementation

    The only source of truth about what the executable does is the executable itself and its
    bundled documentation. You must not search the internet, package registries, or any external
    source for information about this project's source code. Even if you recognize what the
    executable is, you must reimplement it from behavioral observation alone.

    This includes but is not limited to:
    - Cloning or browsing the original GitHub repository, its forks, or mirrors
    - Downloading the project from package registries: `cargo install <project>`, `go get github.com/<org>/<project>`, `pip install <project>`, `apt-get source <project>`, `npm install <project>`, etc.
    - Fetching source tarballs from project websites (e.g., `curl https://lua.org/ftp/lua-5.5.0.tar.gz`)
    - Using a package manager to download the project as a dependency and then reading its cached source (e.g., navigating into `~/.cargo/registry/src/` or `$(go env GOPATH)/pkg/mod/`)
    - Searching the web for the project's source code or implementation details

    ### 2. Wrapping or reusing the reference executable

    Your submission must be a genuine reimplementation. The reference `./executable` is for
    observation only - your final solution must not depend on it or any other pre-built version
    of the same tool at runtime.

    This includes but is not limited to:
    - Writing a wrapper script that delegates to the reference executable (e.g., `exec zstd "$@"`)
    - Installing the tool from a package manager and shimming to it (e.g., `apt-get install nnn && cp $(which nnn) ./executable`)
    - Writing a `compile.sh` that only runs `chmod +x ./executable` or copies the reference executable (`cp ./executable ./executable`)
    - Building a binary whose main function shells out to an external tool (e.g., `Command::new("miniserve").args(args).exec()`)
    - Re-linking prebuilt `.o` object files found in the workspace without writing new source code

    ### 3. How the reference executable may be observed

    All information about the reference `./executable` must be obtained by interacting with it
    through its normal user interface (CLI flags, stdin/stdout, etc.).
    - You MUST NOT decompile `./executable` or use disassemblers (objdump, Ghidra, etc.) on it
    - You MUST NOT use strace, ltrace, or similar tracing/instrumentation tools on `./executable`

    Note: this restriction applies ONLY to the reference `./executable`. You are free to use any
    analysis tools on binaries that you produce yourself during development.

    ## What IS allowed

    - Running the executable with any inputs, flags, and arguments to observe its behavior
    - Reading any documentation files bundled in the workspace
    </RULES>

    Use compact_block when older observations, completed work, or dead ends crowd out useful context.
    Use expand_block when the next step depends on evidence omitted from a summary.
    Avoid unnecessary context operations and repeated work.
  instance_template: |
    ## Task context

    Implement a program matching the externally observable behavior of the reference `./executable` in the workspace root.
    Use the bundled documentation and experiments through its normal user interface, following the system rules.
    No project-specific dependencies are pre-installed, and you do not have access to the internet.
    Python is available as python3.
    For TUI experiments, tmux/libtmux is installed.

    ## Recommended workflow

    1. Read the bundled documentation.
    2. Experiment with the reference executable to identify expected behavior and edge cases.
    3. Implement the behavior independently and compare your results with the reference.
    4. Verify the build works from a fresh checkout.

    ## Submission

    Provide an executable `./compile.sh` that installs required build dependencies and produces `./executable` in the workspace root.
    Keep executables and other build artifacts out of Git by listing them in `.gitignore`.
    Commit your source changes.
    Finish with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as a standalone command.
    The task ends immediately after submission.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  step_limit: 1000
  cost_limit: 0
environment:
  cwd: "/workspace"
  timeout: 180
  container_timeout: "7h"
  environment_class: "docker"
  executable: "docker"
  run_args:
    - "--rm"
    - "--network"
    - "none"
    - "--cpus"
    - "20"
    - "--memory"
    - "60g"
    - "--memory-swap"
    - "60g"
    - "--user"
    - "agent"
    - "--cap-drop"
    - "SYS_PTRACE"
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Narrow the command output or inspect a smaller section.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
    {% if step_limit > 0 and step_limit - n_model_calls < 20 -%}

    <IMPORTANT>
    There is a limit to the steps you can take. You are now {{ step_limit - n_model_calls }} steps away from reaching your limit. After you reach your limit your current solution will be auto-submitted.
    At this point, please abort any specific issues that you are debugging or solving and focus on the big picture. Please make sure that
    1. Your solution compiles and produces an executable (it's ok if it is still missing functionality)
    2. If there are any steps left to do, or limitations that you are aware of, please write them to a document "AGENT_REPORT.md". Focus on handing off to the next agent, i.e., focus on clearly describing the problems and any todo items that are left over.
    </IMPORTANT>
    {%- endif %}
    {% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds < 600 -%}

    <IMPORTANT>
    You are running low on time. You have approximately {{ ((wall_time_limit_seconds - elapsed_seconds) / 60) | int }} minutes remaining before timeout.
    Please wrap up your work now:
    1. Ensure your solution compiles and produces an executable (it's ok if it is still missing functionality)
    2. If there are any steps left to do, or limitations that you are aware of, please write them to a document "AGENT_REPORT.md". Focus on handing off to the next agent, i.e., focus on clearly describing the problems and any todo items that are left over.
    3. Submit with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    </IMPORTANT>
    {%- endif %}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Response reached the output limit (finish_reason={{finish_reason}}).
    Respond more concisely and finish with a valid tool call.
    {%- else -%}
    {{error}}
    Correct the call using its tool schema and retry.
    {%- endif %}
