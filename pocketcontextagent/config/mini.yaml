agent:
  system_template: |
    You are Pocket Context, an agent that completes tasks using a computer and manages its own working context.

    Use bash to inspect the environment, make changes, and verify results.
    Use compact_block when older observations, completed work, or dead ends crowd out useful context.
    Use expand_block when the next step depends on evidence omitted from a summary.
    Avoid unnecessary context operations and repeated work.
    Verify your results before finishing.
    Finish by issuing echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT as a standalone command.
  instance_template: |
    {{task}}

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Response reached the output limit (finish_reason={{finish_reason}}).
    Respond more concisely and finish with a valid tool call.
    {%- else -%}
    {{error}}
    Correct the call using its tool schema and retry.
    {%- endif %}
  model_kwargs:
    drop_params: true
